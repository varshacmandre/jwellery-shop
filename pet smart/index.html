    body {
      margin: 0;
      padding: 0;
      background: #f9f9f9;
    }
    header {
      background-color: lightcoral;
      padding:3rem;
      color: black;
      text-align: center;
      font-size: 6rem;
    }
    .container {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }
    .pet-card {
      width: 250px;
      background: lightgrey;
      margin: 10px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      position: relative;
    }
    .pet-card img {
      width: 100%;
      border-radius: 10px;
    }

 
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }
    .back-btn {
      margin-top: 20px;
      display: inline-block;
      background: #ff6f61;
      color: white;
      padding: 20px 20px;
      text-decoration: none;
      border-radius: 10px;
    }
    .details {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

let favorites = [];

function renderHome() {
  const app = document.getElementById('app');
  app.innerHTML = '<h2>Select a Pet for Adoption</h2><div class="grid">' + 
    pets.map(pet => `
      <div class="pet-card">
        <img src="${pet.image}" alt="${pet.name}">
        <h3>${pet.name}</h3>
        <p>Price: ${pet.price}</p>
        <p>Charm: ${pet.charm}</p>
        <br>
        <a class="back-btn" onclick="showDetails('${pet.id}')">More Info</a>
      </div>
    `).join('') + '</div>';
}

function showDetails(petId) {
  const pet = pets.find(p => p.id === petId);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="details">
      <h2>${pet.name}</h2>
      <img src="${pet.image}" alt="${pet.name}" style="width: 300px; border-radius: 10px;">
      <p><strong>Age:</strong> ${pet.age}</p>
      <p><strong>Price:</strong> ${pet.price}</p>
      <p><strong>Skill:</strong> ${pet.skill}</p>
      <p><strong>Characteristics:</strong> ${pet.characteristics}</p>
      <p><strong>Medical Health:</strong> ${pet.health}</p>
      <br><br>
      <a class="back-btn" onclick="renderHome()">← Back to Home</a>
    </div>
  `;
}

function toggleFavorite(petId) {
  if (favorites.includes(petId)) {
    favorites = favorites.filter(id => id !== petId);
  } else {

  }
  renderHome();
}
